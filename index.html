<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>IVY Rung Chuông Vàng</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: one narrow column like a contestant's answer board; the question sits on a "whiteboard" card, the gold bell marks the game. */
:root{
  --bg:#F2F5FB; --surface:#FFFFFF; --sunk:#E8EDF7; --ink:#16233F; --muted:#56637F; --line:#D3DBEA;
  --accent:#1F4FD8; --accent-ink:#FFFFFF; --accent-soft:#E3EAFD;
  --gold:#B97F00; --gold-fill:#F2B91E; --gold-soft:#FFF2CC; --gold-ink:#3B2A00;
  --ok:#17794F; --ok-soft:#DFF4E8; --bad:#C13328; --bad-soft:#FCE6E3;
  --display:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ipa:"Charis SIL","Doulos SIL","Segoe UI","Noto Sans",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1525; --surface:#172039; --sunk:#111A2F; --ink:#E8EDF9; --muted:#9BA8C6; --line:#2C3859;
  --accent:#86A6FF; --accent-ink:#0E1525; --accent-soft:#1F2D55;
  --gold:#F2BE3B; --gold-fill:#F2BE3B; --gold-soft:#3A2E0E; --gold-ink:#221800;
  --ok:#5FD49D; --ok-soft:#12362A; --bad:#FF8E82; --bad-soft:#43201C; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E1525; --surface:#172039; --sunk:#111A2F; --ink:#E8EDF9; --muted:#9BA8C6; --line:#2C3859;
  --accent:#86A6FF; --accent-ink:#0E1525; --accent-soft:#1F2D55;
  --gold:#F2BE3B; --gold-fill:#F2BE3B; --gold-soft:#3A2E0E; --gold-ink:#221800;
  --ok:#5FD49D; --ok-soft:#12362A; --bad:#FF8E82; --bad-soft:#43201C; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:20px 56px;display:flex;flex-direction:column;gap:28px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
h2{font-size:1.25rem;font-weight:800}
.sub{color:var(--muted);font-size:.9rem;margin:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sp{justify-content:space-between}
section{display:flex;flex-direction:column;gap:12px}

/* header */
.top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.brand svg{flex:none}
.brand h1{font-size:1.5rem;font-weight:800}
.brand p{margin:0;color:var(--muted);font-size:.82rem;letter-spacing:.04em;text-transform:uppercase}
.name{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted)}
.name input{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;width:13rem;max-width:100%;color:var(--ink)}
.strip{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
.strip b{font-family:var(--display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.stat{display:flex;flex-direction:column;font-size:.82rem;color:var(--muted)}
.stat b{color:var(--ink)}

.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 16px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.link{border:0;background:none;color:var(--accent);padding:4px 2px;text-decoration:underline;text-underline-offset:3px}
.btn.sm{padding:6px 12px;font-size:.88rem}

/* topics */
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.topic{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.topic[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.topic .en{font-weight:600;font-size:.93rem}
.topic .vn{font-size:.8rem;color:var(--muted)}
.topic .meta{display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.bar{height:5px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:3px}
.topic[aria-pressed="true"] .bar{background:var(--surface)}

/* types */
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.type{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:baseline;min-width:0}
.type:hover,.topic:hover{border-color:var(--accent)}
.type .no{font-family:var(--display);font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;grid-row:span 2;font-size:1.15rem;min-width:1.4em}
.type .en{font-weight:600;font-size:.93rem}
.type .vn{font-size:.78rem;color:var(--muted)}
.type.mix{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.type.mix .no,.type.mix .vn{color:var(--accent-ink)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 14px;font-weight:600;font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.game{border-radius:var(--r);padding:16px;text-align:left;border:1.5px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:6px}
.game h3{font-size:1.15rem;font-weight:800}
.game p{margin:0;font-size:.88rem;color:var(--muted)}
.game small{font-size:.78rem;font-variant-numeric:tabular-nums;color:var(--muted)}
.game.bell{background:var(--gold-soft);border-color:var(--gold-fill)}
.game.bell h3{color:var(--gold)}
.game:hover{border-color:var(--accent)}

/* play */
.phead{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.phead .lab{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.phead .cnt{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums}
.prog{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.timer i{background:var(--gold-fill);transition:width .1s linear}
.ladder{display:flex;gap:4px;flex-wrap:wrap}
.ladder i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface)}
.ladder i.done{background:var(--gold-fill);border-color:var(--gold-fill)}
.ladder i.cur{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.board{background:var(--surface);border:2.5px solid var(--ink);border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 5px 0 var(--line)}
.q{font-family:var(--display);font-weight:600;font-size:1.3rem;line-height:1.3;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.q mark{background:var(--gold-soft);color:var(--ink);padding:0 .25em;border-radius:5px}
.q .gap{display:inline-block;min-width:4.5em;border-bottom:3px solid var(--accent);vertical-align:baseline}
.hint{color:var(--muted);font-size:.9rem;margin:0}
.pic{font-size:5.5rem;line-height:1.1;text-align:center;padding:6px 0}
.chart{width:100%;max-width:340px;margin:0 auto;display:block}
.tiles{display:flex;flex-wrap:wrap;gap:6px}
.tiles span{width:2.1em;height:2.4em;display:grid;place-items:center;border:1.5px solid var(--line);border-radius:8px;font-family:var(--display);font-weight:800;font-size:1.15rem;text-transform:uppercase;background:var(--sunk)}
.tiles span.b{background:var(--surface);border-style:dashed;border-color:var(--accent);color:var(--accent)}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;min-width:0;overflow-wrap:anywhere}
.opt .k{width:1.9em;height:1.9em;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font-weight:700;font-size:.85rem}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);color:var(--surface)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{background:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default;color:var(--ink)}
.typed{display:flex;gap:10px;flex-wrap:wrap}
.typed input{flex:1 1 12rem;min-width:0;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;font-size:1.1rem}
.fb{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--ok-soft);border:1.5px solid var(--ok)}
.fb.bad{background:var(--bad-soft);border:1.5px solid var(--bad)}
.fb strong{font-family:var(--display);font-size:1.05rem}
.fb.ok strong{color:var(--ok)} .fb.bad strong{color:var(--bad)}
.winfo{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:.95rem}
.winfo .ipa,.ipa{font-family:var(--ipa);color:var(--muted)}
.spk{border:1.5px solid var(--line);background:var(--surface);border-radius:50%;width:2em;height:2em;display:inline-grid;place-items:center;padding:0;flex:none}
.spk svg{width:1em;height:1em}
.result{text-align:center;align-items:center}
.result .big{font-family:var(--display);font-weight:800;font-size:3.2rem;line-height:1;font-variant-numeric:tabular-nums}
.bellbig{transform-origin:50% 8%}
.ring .bellbig{animation:swing 1.1s ease-in-out 3}
@keyframes swing{0%,100%{transform:rotate(0)}25%{transform:rotate(16deg)}75%{transform:rotate(-16deg)}}
@media (prefers-reduced-motion:reduce){.ring .bellbig{animation:none}.prog i{transition:none}}
.review{list-style:none;margin:0;padding:0;display:grid;gap:6px;text-align:left;width:100%}
.review li{background:var(--sunk);border-radius:10px;padding:8px 12px;font-size:.92rem;overflow-wrap:anywhere}
.review b{font-weight:600}

/* match */
.match{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:560px){.match{grid-template-columns:repeat(3,1fr)}}
.card{min-height:4.6rem;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px;font-size:.88rem;font-weight:500;overflow-wrap:anywhere;min-width:0}
.card.en{font-weight:700}
.card[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.card.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.card.bad{border-color:var(--bad);background:var(--bad-soft)}

/* progress */
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th,.tbl td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tbl td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
.pill{display:inline-block;border-radius:99px;padding:1px 9px;font-size:.74rem;font-weight:600;white-space:nowrap}
.pill.s0{background:var(--sunk);color:var(--muted)}
.pill.s1{background:var(--accent-soft);color:var(--accent)}
.pill.s2{background:var(--ok-soft);color:var(--ok)}
.pill.s3{background:var(--bad-soft);color:var(--bad)}
.filters{display:flex;flex-wrap:wrap;gap:10px}
.filters input,.filters select{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0;flex:1 1 11rem}
.note{font-size:.85rem;color:var(--muted);margin:0}
.warn{background:var(--bad-soft);border:1.5px solid var(--bad);border-radius:12px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}

/* colour pass: each topic and each question type has its own hue */
.top{background:#C4202E;color:#fff;border-radius:18px;padding:16px 18px}
.top .brand p,.top .name{color:#fff;opacity:.92}
.top svg path:first-child{stroke:#fff}
.top svg circle{fill:#fff}
.top .name input{border-color:transparent}
.strip .stat:nth-of-type(1) b{color:var(--ok)}
.strip .stat:nth-of-type(2) b{color:var(--accent)}
.strip .stat:nth-of-type(3) b{color:var(--bad)}
.topic,.type,.board,.game.alt{--c:hsl(var(--h) 72% 38%)}
.topic,.type:not(.mix){background:color-mix(in srgb,var(--c) 13%,var(--surface));border-color:color-mix(in srgb,var(--c) 45%,var(--surface))}
.topic:hover,.type:not(.mix):hover{border-color:var(--c)}
.topic[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.topic[aria-pressed="true"] .vn,.topic[aria-pressed="true"] .meta{color:#fff}
.topic[aria-pressed="true"] .bar{background:rgba(255,255,255,.3)}
.topic[aria-pressed="true"] .bar i{background:#fff}
.type:not(.mix) .no{background:var(--c);color:#fff;width:2em;height:2em;border-radius:50%;display:grid;place-items:center;font-size:.95rem;align-self:center}
.type.mix{background:linear-gradient(100deg,hsl(350 72% 42%),hsl(25 80% 42%),hsl(140 60% 34%),hsl(215 75% 45%));border-color:transparent;color:#fff}
.type.mix .no,.type.mix .vn{color:#fff}
.board[style]{border-color:var(--c);box-shadow:0 6px 0 color-mix(in srgb,var(--c) 40%,var(--surface))}
.board[style] .q mark{background:color-mix(in srgb,var(--c) 22%,var(--surface))}
.game.alt{background:color-mix(in srgb,var(--c) 14%,var(--surface));border-color:color-mix(in srgb,var(--c) 55%,var(--surface))}
.game.alt h3{color:var(--c)}
.opt:nth-child(1) .k{background:hsl(215 78% 45%);color:#fff}
.opt:nth-child(2) .k{background:hsl(25 85% 42%);color:#fff}
.opt:nth-child(3) .k{background:hsl(280 55% 48%);color:#fff}
.opt:nth-child(4) .k{background:hsl(330 68% 44%);color:#fff}
.opt.ok .k{background:var(--ok);color:var(--surface)}
.opt.bad .k{background:var(--bad);color:var(--surface)}
.card.en{background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.card:not(.en){background:color-mix(in srgb,var(--gold-fill) 16%,var(--surface))}
.card.ok{background:var(--ok-soft)}.card.bad{background:var(--bad-soft)}
.card[aria-pressed="true"]{background:var(--accent-soft)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .topic:not([aria-pressed="true"]),:root:not([data-theme="light"]) .type,:root:not([data-theme="light"]) .board,:root:not([data-theme="light"]) .game.alt{--c:hsl(var(--h) 75% 62%)}}
:root[data-theme="dark"] .topic:not([aria-pressed="true"]),:root[data-theme="dark"] .type,:root[data-theme="dark"] .board,:root[data-theme="dark"] .game.alt{--c:hsl(var(--h) 75% 62%)}

.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.steps li{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--sunk);color:var(--muted);font-weight:600;font-size:.88rem;min-width:0;line-height:1.25}
.steps small{display:block;font-weight:500;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em}
.steps .sn{flex:none;width:1.9em;height:1.9em;border-radius:50%;display:grid;place-items:center;background:var(--surface);font-family:var(--display);font-weight:800}
.steps li.cur{background:#C4202E;color:#fff}
.steps li.cur .sn{background:#fff;color:#C4202E}
.steps li.done{background:var(--ok-soft);color:var(--ok)}
.steps li.done .sn{background:var(--ok);color:var(--surface)}
@media (max-width:480px){.steps li{flex-direction:column;align-items:flex-start;font-size:.8rem}}
.act{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:2;background:var(--surface);border:2px solid var(--ink);border-radius:14px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri:disabled:hover{border-color:var(--accent)}
h3.grp{font-family:var(--body);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:6px}
:root .type[aria-pressed="true"]{--c:hsl(var(--h) 72% 38%)}
.type[aria-pressed="true"]:not(.mix){background:var(--c);border-color:var(--c);color:#fff}
.type[aria-pressed="true"]:not(.mix) .vn{color:#fff}
.type[aria-pressed="true"]:not(.mix) .no{background:#fff;color:var(--c)}
.type.mix[aria-pressed="true"],.game[aria-pressed="true"]{outline:4px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="44" height="44" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 5c-8 0-13 6-13 15 0 8-2 12-5 15h36c-3-3-5-7-5-15 0-9-5-15-13-15z" fill="var(--gold-fill)" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/><circle cx="24" cy="40" r="4" fill="var(--ink)"/><path d="M17 15c1-3 3-5 6-5" stroke="var(--surface)" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>
      <div><h1>IVY Rung Chuông Vàng</h1><p>IELTS Vocabulary · IVY booklet</p></div>
    </div>
    <label class="name" for="stuName">Tên của em
      <input id="stuName" type="text" maxlength="40" placeholder="Nhập tên để lưu tiến độ" autocomplete="off">
    </label>
  </header>

  <ol class="steps" id="steps" aria-label="Các bước"></ol>

  <main id="home" class="wrap" style="padding:0;max-width:none"></main>
  <main id="play" class="wrap" style="padding:0;max-width:none" hidden></main>
  <main id="prog" class="wrap" style="padding:0;max-width:none" hidden></main>

    h+='<section><div class="row sp"><div><h2>Bước 1: Chọn chủ đề em đã học</h2><p class="sub">Chạm vào một hoặc nhiều chủ đề. Chọn xong, bấm nút Tiếp tục ở cuối màn hình.</p></div>'
     +'<div class="row"><button class="btn link" id="selAll">Chọn tất cả</button><button class="btn link" id="selNone">Bỏ chọn</button></div></div><div class="topics">'
     +D.topics.map((t,i)=>{const ws=W.filter(w=>w.t===i),c=counts(ws);return '<button class="topic" style="--h:'+HUES[i]+'" data-t="'+i+'" aria-pressed="'+S.sel.includes(i)+'"><span class="en">'+esc(t[0])+'</span><span class="vn">'+esc(t[1])+'</span><span class="meta"><span>'+ws.length+' từ</span><span>thuộc '+c[2]+'</span></span><span class="bar"><i style="width:'+(c[2]/ws.length*100)+'%"></i></span></button>'}).join('')+'</div></section>';
    h+='<div class="act"><span>'+(S.sel.length?'Đã chọn <b>'+S.sel.length+' chủ đề</b> · '+p.length+' từ':'Em chưa chọn chủ đề nào.')+'</span><button class="btn pri" id="go2"'+(S.sel.length?'':' disabled')+'>Tiếp tục: chọn dạng bài</button></div>';
  }else{
    const names=S.sel.slice().sort((x,y)=>x-y).map(i=>D.topics[i][0]);
    h+='<section><div><h2>Bước 2: Chọn một dạng bài</h2><p class="sub">Chủ đề đã chọn: '+esc(names.join(', ')||'tất cả')+'. <button class="btn link" id="go1">Đổi chủ đề</button></p><p class="sub">Chạm vào một dạng bài hoặc một trò chơi, rồi bấm Bắt đầu làm bài ở cuối màn hình.</p></div>'
     +'<div class="row"><span class="sub">Số câu mỗi bài luyện</span><div class="seg" role="group" aria-label="Số câu">'+[10,15,20].map(n=>'<button data-n="'+n+'" aria-pressed="'+(S.n===n)+'">'+n+'</button>').join('')+'</div></div>'
     +'<h3 class="grp">Bài luyện tập</h3><div class="types">'+TYPES.map((t,i)=>'<button class="type" style="--h:'+HUES[(i*5)%12]+'" data-type="'+t[0]+'" aria-pressed="'+(PICK===t[0])+'"><span class="no">'+(i+1)+'</span><span class="en">'+t[1]+'</span><span class="vn">'+t[2]+'</span></button>').join('')
     +'<button class="type mix" data-type="mix" aria-pressed="'+(PICK==='mix')+'"><span class="no">12+</span><span class="en">Mixed practice</span><span class="vn">Trộn cả 12 dạng</span></button></div>'
     +'<h3 class="grp">Trò chơi</h3><div class="games"><button class="game bell" data-type="bell" aria-pressed="'+(PICK==='bell')+'"><h3>Rung Chuông Vàng</h3><p>'+BELL_N+' câu, mỗi câu '+BELL_SEC+' giây. Làm hết cả '+BELL_N+' câu rồi xem điểm.</p><small>Điểm cao nhất: '+(S.best.bell||0)+' / '+BELL_N+'</small></button>'
     +'<button class="game alt" style="--h:165" data-type="match" aria-pressed="'+(PICK==='match')+'"><h3>Ghép từ – nghĩa</h3><p>Ghép 6 từ tiếng Anh với nghĩa tiếng Việt, tính giờ.</p><small>Kỷ lục: '+(S.best.match?S.best.match+' giây':'chưa có')+'</small></button></div></section>';
    h+='<div class="act"><span>'+(PICK?'Đã chọn: <b>'+esc(pickName())+'</b>':'Em chưa chọn dạng bài nào.')+'</span><span class="row"><button class="btn" id="go1b">Quay lại bước 1</button><button class="btn pri" id="go3"'+(PICK?'':' disabled')+'>Bắt đầu làm bài</button></span></div>';
  }
  const el=$('#home');el.innerHTML=h;
  $('#toProg').onclick=()=>show('prog');const wk=$('#weak');if(wk)wk.onclick=startWeak;
  if(STEP===1){
    el.querySelectorAll('.topic').forEach(b=>b.onclick=()=>{const t=+b.dataset.t;S.sel=S.sel.includes(t)?S.sel.filter(x=>x!==t):S.sel.concat(t);save();renderHome()});
    $('#selAll').onclick=()=>{S.sel=D.topics.map((_,i)=>i);save();renderHome()};$('#selNone').onclick=()=>{S.sel=[];save();renderHome()};
    $('#go2').onclick=()=>{if(!S.sel.length)return;STEP=2;renderHome();window.scrollTo(0,0)};
  }else{
    const back=()=>{STEP=1;renderHome();window.scrollTo(0,0)};$('#go1').onclick=back;$('#go1b').onclick=back;
    el.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{S.n=+b.dataset.n;save();renderHome()});
    el.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{PICK=b.dataset.type;renderHome()});
    $('#go3').onclick=()=>{if(!PICK)return;if(PICK==='bell')start('mix',{bell:true});else if(PICK==='match')startMatch();else start(PICK)};
  }}
function startWeak(){const p=W.filter(w=>status(w.k)===3);if(!p.length)return;start('mix',{pool:p,types:['meaning','meaning','spell','miss','scr'],title:'Ôn từ hay sai'})}

/* ---------- progress ---------- */
let PF={q:'',t:-1,s:-1,lim:40},ASK=false;
function renderProg(){const all=counts(W);
  let h='<div class="row sp"><h2>Tiến độ của '+(S.name?esc(S.name):'em')+'</h2><button class="btn sm" id="back">Về trang chính</button></div>'
   +'<div class="strip"><div class="stat"><b>'+all[2]+'</b>đã thuộc</div><div class="stat"><b>'+all[1]+'</b>đang học</div><div class="stat"><b>'+all[3]+'</b>cần ôn lại</div><div class="stat"><b>'+all[0]+'</b>chưa học</div>'+(all[3]?'<button class="btn pri sm" id="weak">Ôn từ hay sai</button>':'')+'</div>'
   +'<p class="note">Một từ được tính là đã thuộc khi em trả lời đúng 3 lần liên tiếp. Tiến độ được lưu trên trình duyệt của máy này.</p>';
  h+='<section><h2>Kết quả theo dạng bài</h2><div class="scroll"><table class="tbl"><thead><tr><th>Dạng bài</th><th>Đã làm</th><th>Đúng</th><th>Tỉ lệ</th></tr></thead><tbody>'
   +TYPES.map((t,i)=>{const r=S.types[t[0]]||{c:0,t:0};return '<tr><td>'+(i+1)+'. '+t[1]+'</td><td class="n">'+r.t+'</td><td class="n">'+r.c+'</td><td class="n">'+(r.t?Math.round(r.c/r.t*100)+'%':'–')+'</td></tr>'}).join('')+'</tbody></table></div></section>';
  h+='<section><h2>Danh sách từ</h2><div class="filters"><input id="fq" type="search" placeholder="Tìm từ hoặc nghĩa" value="'+esc(PF.q)+'" aria-label="Tìm từ">'
   +'<select id="ft" aria-label="Chủ đề"><option value="-1">Tất cả chủ đề</option>'+D.topics.map((t,i)=>'<option value="'+i+'"'+(PF.t===i?' selected':'')+'>'+esc(t[0])+'</option>').join('')+'</select>'
   +'<select id="fs" aria-label="Trạng thái"><option value="-1">Mọi trạng thái</option>'+[3,1,2,0].map(i=>'<option value="'+i+'"'+(PF.s===i?' selected':'')+'>'+SLAB[i]+'</option>').join('')+'</select></div><div id="wl"></div></section>';
  h+='<section><h2>Xóa tiến độ</h2>'+(ASK?'<div class="warn"><span>Xóa toàn bộ tiến độ và kỷ lục trên máy này? Không thể khôi phục.</span><span class="row"><button class="btn sm" id="rsYes">Xóa hết</button><button class="btn sm pri" id="rsNo">Giữ lại</button></span></div>':'<div><button class="btn sm" id="rs">Xóa tiến độ để học lại từ đầu</button></div>')+'</section>';
  const el=$('#prog');el.innerHTML=h;$('#back').onclick=()=>show('home');const wk=$('#weak');if(wk)wk.onclick=startWeak;
  $('#fq').oninput=e=>{PF.q=e.target.value;PF.lim=40;list()};$('#ft').onchange=e=>{PF.t=+e.target.value;PF.lim=40;list()};$('#fs').onchange=e=>{PF.s=+e.target.value;PF.lim=40;list()};
  if(ASK){$('#rsYes').onclick=()=>{S.words={};S.types={};S.best={bell:0,match:0};ASK=false;save();renderProg()};$('#rsNo').onclick=()=>{ASK=false;renderProg()}}else $('#rs').onclick=()=>{ASK=true;renderProg()};
  list()}
function list(){const q=PF.q.trim().toLowerCase();const r=W.filter(w=>(PF.t<0||w.t===PF.t)&&(PF.s<0||status(w.k)===PF.s)&&(!q||w.w.toLowerCase().includes(q)||w.vi.toLowerCase().includes(q)));
  let h='<p class="note">'+r.length+' từ</p><div class="scroll"><table class="tbl"><thead><tr><th>Từ</th><th>Nghĩa</th><th>Trạng thái</th></tr></thead><tbody>'
   +r.slice(0,PF.lim).map(w=>{const s=status(w.k);return '<tr><td><div class="row" style="gap:6px;flex-wrap:nowrap">'+(canSpeak?'<button class="spk" data-say="'+esc(w.k)+'" aria-label="Nghe '+esc(w.k)+'">'+SPK+'</button>':'')+'<span><b>'+esc(w.w)+'</b><br><span class="ipa">'+esc(w.ipa)+'</span></span></div></td><td>'+esc(w.vi)+(w.def?'<br><span class="sub">'+esc(w.def)+'</span>':'')+'</td><td><span class="pill s'+s+'">'+SLAB[s]+'</span></td></tr>'}).join('')+'</tbody></table></div>';
  if(r.length>PF.lim)h+='<div style="margin-top:10px"><button class="btn sm" id="more">Xem thêm '+Math.min(40,r.length-PF.lim)+' từ</button></div>';
  $('#wl').innerHTML=h;const m=$('#more');if(m)m.onclick=()=>{PF.lim+=40;list()}}

const nameEl=$('#stuName');nameEl.value=S.name||'';nameEl.oninput=()=>{S.name=nameEl.value.trim();save()};
renderHome();
</script>

</body>
</html>
